# Perfil local: banco H2 em memoria em modo de compatibilidade Oracle.
# As tabelas e os dados de exemplo sao criados a cada inicializacao.
spring.datasource.url=jdbc:h2:mem:rotaseca;MODE=Oracle;DB_CLOSE_DELAY=-1;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema-h2.sql
spring.sql.init.data-locations=classpath:db/data.sql
spring.h2.console.enabled=true
