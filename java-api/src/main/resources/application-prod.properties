# Perfil de producao (Render): banco Oracle da FIAP.
# Defina DB_USER (ex.: rm123456) e DB_PASSWORD nas variaveis de ambiente do Render.
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
# As tabelas sao criadas uma unica vez rodando database/01_DDL e 02_DML no SQL Developer
spring.sql.init.mode=never
